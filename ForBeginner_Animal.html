<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sing & Meet Animals — CASIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1C1C24; --muted: #8C8C98; --line: #ECECF1; --accent: #FF5A5F; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; color: var(--ink);
      font-family: 'Inter', 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .fun { font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Inter', sans-serif; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* HUD */
    .hud { position: absolute; top: 22px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
    .brand { font-size: .72rem; font-weight: 600; letter-spacing: .22em; color: var(--muted); }
    .brand b { color: var(--ink); }
    .mic { display: none; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: .78rem; font-weight: 600; box-shadow: 0 6px 20px -12px rgba(0,0,0,.25); }
    .mic .dot { width: 8px; height: 8px; border-radius: 50%; background: #2FBF71; box-shadow: 0 0 0 0 rgba(47,191,113,.5); animation: pulse 1.6s infinite; }
    .mic .meter { width: 90px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
    .mic .meter div { height: 100%; width: 0; background: var(--ink); border-radius: 6px; transition: width .05s; }
    .mic .hz { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 54px; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,191,113,.5); } 70% { box-shadow: 0 0 0 8px rgba(47,191,113,0); } 100% { box-shadow: 0 0 0 0 rgba(47,191,113,0); } }

    /* Now-playing card */
    #now { position: absolute; left: 50%; bottom: 150px; transform: translate(-50%, 10px); z-index: 5; pointer-events: none;
      display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 12px 26px 12px 12px;
      box-shadow: 0 18px 40px -22px rgba(0,0,0,.3); opacity: 0; transition: opacity .4s, transform .4s; }
    #now.show { opacity: 1; transform: translate(-50%, 0); }
    #now .pic { width: 74px; height: 74px; border-radius: 16px; display: grid; place-items: center; transition: background .3s; }
    #now img { width: 64px; height: 64px; }
    #now .chord { font-size: 2rem; font-weight: 700; line-height: 1; transition: color .3s; }
    #now .name { font-size: .8rem; font-weight: 600; letter-spacing: .2em; color: var(--muted); margin-top: 6px; }

    /* Start screen */
    #intro { position: absolute; inset: 0; z-index: 20; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .parade { display: flex; gap: 6px; margin-bottom: 30px; }
    .parade img { width: 64px; height: 64px; animation: hop 1.8s ease-in-out infinite; }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px) rotate(-4deg); } 60% { transform: translateY(0); } }
    #intro .eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .24em; color: var(--muted); }
    #intro h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); font-weight: 700; margin-top: 10px; line-height: 1.05; }
    #intro p { color: var(--muted); margin-top: 14px; font-size: 1.05rem; line-height: 1.6; }
    .btn { margin-top: 30px; font: 600 1.05rem 'Fredoka', 'Inter', sans-serif; letter-spacing: .02em; color: #fff; background: var(--ink); border: 0; border-radius: 999px; padding: 16px 40px; cursor: pointer; transition: transform .15s, background .2s; }
    .btn:hover { transform: translateY(-2px) scale(1.02); background: #FF5A5F; }
    .ghost { margin-top: 12px; font: 600 .9rem 'Inter', sans-serif; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    #error { margin-top: 16px; color: #E5383B; font-size: .9rem; display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="brand">CASIO · <b>SING &amp; MEET ANIMALS</b></div>
    <div class="mic" id="mic"><span class="dot"></span>MIC<div class="meter"><div id="meter"></div></div><span class="hz" id="hz">-- Hz</span></div>
  </div>

  <div id="now"><div class="pic" id="now-pic"><img id="now-img" alt=""></div><div><div class="chord fun" id="now-chord">C Major</div><div class="name" id="now-name">LION</div></div></div>

  <div id="intro">
    <div class="parade" id="parade"></div>
    <div class="eyebrow">CASIO · FOR BEGINNERS</div>
    <h1 class="fun">Sing a note,<br>meet an animal!</h1>
    <p>Every note has its own animal friend.<br>Sing “la~” high and low, tap the keys,<br>or just play your CASIO keyboard.</p>
    <button class="btn" id="start">Start singing</button>
    <button class="ghost" id="nomic">Play with keys only</button>
    <div id="error"></div>
  </div>

      KOALA: `

        <circle cx="80" cy="38" r="18" fill="#9EA3AF"/><circle cx="79" cy="40" r="11" fill="#E9E5EE"/>

        <circle cx="34" cy="29" r="8" fill="#fff"/><circle cx="66" cy="29" r="8" fill="#fff"/>
        ${_eye(35,30,1.1)}${_eye(65,30,1.1)}
        <path d="M14 56 C14 40 30 36 50 36 C70 36 86 40 86 56 C86 72 72 82 50 82 C28 82 14 72 14 56Z" fill="#7BCB7C"/>

    const animalSVG = (name) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${ANIMAL_SVG[name] || ''}</svg>`;
    const ANIMAL_IMG = {};
    Object.keys(ANIMAL_SVG).forEach(name => {
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(animalSVG(name));
      ANIMAL_IMG[name] = img;
    });

    /* ===== Shared: microphone + pitch detection ===== */
    const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const PITCH_COLORS = ['#FF5A5F','#FF7F3F','#FFA62B','#F5C02E','#8CCB3A','#2FBF71','#20B8AE','#2FA4E7','#4C74F6','#7B61FF','#B05CEB','#F2569F'];
    const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return { r: n >> 16 & 255, g: n >> 8 & 255, b: n & 255 }; };
    const freqToMidi = f => Math.round(12 * Math.log2(f / 440)) + 69;
    const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

    function autoCorrelate(buf, sampleRate) {
      let size = buf.length, rms = 0;
      for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / size);
      if (rms < 0.01) return -1;
      let r1 = 0, r2 = size - 1;
      const thres = 0.2;
      for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }
      buf = buf.slice(r1, r2); size = buf.length;
      const maxLag = Math.min(size, Math.floor(sampleRate / 60));   // ignore below ~60 Hz (faster)
      const c = new Float32Array(maxLag);
      for (let i = 0; i < maxLag; i++) { let s = 0; for (let j = 0; j < size - i; j++) s += buf[j] * buf[j + i]; c[i] = s; }
      let d = 0; while (d < maxLag - 1 && c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < maxLag; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      if (maxpos <= 0) return -1;
      let T0 = maxpos;
      const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1] || 0;
      const a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);
      return sampleRate / T0;
    }

    const Mic = {
      ctx: null, analyser: null, buf: null, freq: null, ready: false,
      async init() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Please open this page in the latest Google Chrome.');
        this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        const src = this.ctx.createMediaStreamSource(stream);
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 2048;
        this.analyser.smoothingTimeConstant = 0.75;
        this.buf = new Float32Array(this.analyser.fftSize);
        this.freq = new Uint8Array(this.analyser.frequencyBinCount);
        src.connect(this.analyser);
        await this.ctx.resume();
        this.ready = true;
      },
      audioCtx() { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); return this.ctx; },
      // returns { volume 0..1, pitch Hz or -1 }
      read(noise = 0.06) {
        if (!this.ready) return { volume: 0, pitch: -1 };
        this.analyser.getFloatTimeDomainData(this.buf);
        this.analyser.getByteFrequencyData(this.freq);
        let s = 0; for (let i = 0; i < this.buf.length; i++) s += this.buf[i] * this.buf[i];
        const volume = Math.min(1, Math.sqrt(s / this.buf.length) * 4);
        let pitch = -1;
        if (volume > noise) { const p = autoCorrelate(this.buf, this.ctx.sampleRate); if (p > 80 && p < 1100) pitch = p; }
        return { volume, pitch };
      }
    };

    // Median filter + "must hold N frames" so the note does not flicker
    function createStabilizer(history = 5, holdFrames = 3) {
      const hist = []; let cand = null, count = 0, stable = null;
      return {
        push(pitch) {
          if (pitch < 0) { hist.length = 0; cand = null; count = 0; stable = null; return null; }
          hist.push(pitch); if (hist.length > history) hist.shift();
          const med = [...hist].sort((a, b) => a - b)[hist.length >> 1];
          const midi = freqToMidi(med);
          if (midi === cand) count++; else { cand = midi; count = 1; }
          if (count >= holdFrames) stable = { midi, freq: med };
          return stable;
        }
      };
    }

    // Soft synth used for chords / notes
    function playTone(ctx, freqs, { dur = 1.2, vol = 0.09, type = 'triangle', attack = 0.01 } = {}) {
      const t = ctx.currentTime;
      const out = ctx.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(vol, t + attack);
      out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      out.connect(ctx.destination);
      freqs.forEach(f => {
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
        const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
        const g2 = ctx.createGain(); g2.gain.value = 0.25;
        o.connect(out); o2.connect(g2); g2.connect(out);
        o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
      });
    }

    // Light 2-octave keyboard (C3–B4) drawn on canvas. Returns key rects for hit testing.
    function drawLightKeyboard(ctx, x, y, w, h, activeMidi, activeColor) {
      const whites = [0, 2, 4, 5, 7, 9, 11];
      const kw = w / 14; const rects = [];
      for (let o = 0; o < 2; o++) whites.forEach((pc, i) => {
        const idx = o * 7 + i, midi = 48 + o * 12 + pc, kx = x + idx * kw;
        const on = activeMidi === midi;
        ctx.fillStyle = on ? activeColor : '#FFFFFF';
        ctx.strokeStyle = '#E2E2E8'; ctx.lineWidth = 1;
        roundRectPath(ctx, kx + 1.5, y, kw - 3, h, [0, 0, 8, 8]); ctx.fill(); ctx.stroke();
        ctx.fillStyle = on ? '#FFFFFF' : '#B6B6C2';
        ctx.font = '600 12px Inter, "Helvetica Neue", sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(NOTE_NAMES[pc] + (3 + o), kx + kw / 2, y + h - 14);
        rects.push({ midi, x: kx, y, w: kw, h, black: false });
      });
      const blacks = [[1, 0], [3, 1], [6, 3], [8, 4], [10, 5]];
      for (let o = 0; o < 2; o++) blacks.forEach(([pc, after]) => {
        const midi = 48 + o * 12 + pc; const bx = x + (o * 7 + after + 1) * kw - kw * 0.3; const bw = kw * 0.6, bh = h * 0.6;
        const on = activeMidi === midi;
        ctx.fillStyle = on ? activeColor : '#1E1E26';
        roundRectPath(ctx, bx, y, bw, bh, [0, 0, 6, 6]); ctx.fill();
        rects.push({ midi, x: bx, y, w: bw, h: bh, black: true });
      });
      return rects;
    }
    function roundRectPath(ctx, x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
    function hitKey(rects, px, py) {
      const inR = r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
      return (rects.find(r => r.black && inR(r)) || rects.find(r => !r.black && inR(r)) || {}).midi;
    }
    const foldMidi = m => { while (m < 48) m += 12; while (m > 71) m -= 12; return m; };

    /* ===== Shared: CASIO keyboard (USB-MIDI) input ===== */
    const CasioMIDI = {
      connected: false, muted: true, state: 'waiting', _hint: true, held: new Map(), _on: [], _off: [], badge: null,
      onNote(fn) { this._on.push(fn); }, onRelease(fn) { this._off.push(fn); },
      // true = the page should NOT play its own sound (the keyboard speaker plays it)
      silent() { return this.connected && this.muted; },
      init() {
        this._badge(); this._render();
        // Web MIDI Browser (iPad) may inject its MIDI support after the page loads → wait up to 10 s
        let tries = 0;
        const attempt = () => {
          if (navigator.requestMIDIAccess) return this._request();
          if (++tries < 40) setTimeout(attempt, 250); else this._status('none');
        };
        attempt();
        setTimeout(() => { this._hint = false; this._render(); }, 15000);   // hide 'looking / not found' after 15 s (errors stay)
      },
      _request() {
        let done = false;
        const ok = access => { if (!done) { done = true; this._setup(access); } };
        const ng = () => this._status('denied');
        try {
          const p = navigator.requestMIDIAccess({ sysex: false }, ok, ng);   // old shims use callbacks
          if (p && typeof p.then === 'function') p.then(ok, ng);             // current spec uses a Promise
        } catch (e) {
          try { navigator.requestMIDIAccess().then(ok, ng); } catch (e2) { this._status('denied'); }
        }
      },
      _inputs(access) {
        let ins = access.inputs;
        if (typeof ins === 'function') { try { ins = ins.call(access); } catch (e) { ins = null; } }   // old spec: inputs()
        const out = [];
        if (!ins) return out;
        if (Array.isArray(ins)) return ins.slice();
        if (typeof ins.forEach === 'function') { ins.forEach(v => out.push(v)); return out; }
        if (typeof ins.values === 'function') { const it = ins.values(); for (let r = it.next(); !r.done; r = it.next()) out.push(r.value); }
        return out;
      },
      _setup(access) {
        this.state = 'ready';
        const refresh = () => {
          const ins = this._inputs(access);
          ins.forEach(inp => {
            if (!inp || inp.__casio) return;
            inp.__casio = true;
            const h = e => this._msg(e && e.data ? e.data : e);
            inp.onmidimessage = h;
            if (typeof inp.addEventListener === 'function') { try { inp.addEventListener('midimessage', h); } catch (e) {} }
          });
          const was = this.connected;
          this.connected = this.connected || ins.length > 0;
          if (ins.length === 0 && this._seen === 0) this.connected = false;
          if (was !== this.connected || !this._drawn) { this._drawn = true; this._render(); }
        };
        this._seen = 0;
        try { access.onstatechange = refresh; } catch (e) {}
        refresh();
        setInterval(refresh, 2000);   // some shims never fire statechange → poll
      },
      _status(st) { this.state = st; this._render(); },
      _msg(d) {
        if (!d || d.length < 2) return;
        const st = d[0], note = d[1], vel = d.length > 2 ? d[2] : 0;
        const key = st + ':' + note + ':' + vel, now = performance.now();
        if (key === this._lastKey && now - this._lastAt < 8) return;      // same event delivered twice
        this._lastKey = key; this._lastAt = now;
        this._seen = (this._seen || 0) + 1;
        if (!this.connected) { this.connected = true; this._render(); }
        const cmd = st & 0xf0;
        if (cmd === 0x90 && vel > 0) { this.held.set(note, vel); this._on.forEach(f => f(note, vel / 127)); }
        else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) { this.held.delete(note); this._off.forEach(f => f(note)); }
      },
      _badge() {
        // top-centre status pill for the CASIO keyboard
        const bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center';
        const pill = 'display:flex;align-items:center;gap:8px;font:600 12px Inter,"Helvetica Neue",sans-serif;color:#111116;background:#fff;' +
          'border:1px solid #E6E6EB;border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none;box-shadow:0 6px 18px -10px rgba(0,0,0,.3)';
        const b = document.createElement('button'); b.style.cssText = pill + ';display:none';
        b.title = 'Click to switch the PC sound on/off';
        b.onclick = () => { this.muted = !this.muted; this._render(); };
        bar.appendChild(b); document.body.appendChild(bar); this.badge = b;
      },
      _render() {
        if (!this.badge) return;
        const dot = c => `<span style="width:8px;height:8px;border-radius:50%;background:${c}"></span>`;
        if (this.connected) {
          this.badge.style.display = 'flex';
          this.badge.innerHTML = `${dot('#2FBF71')}CASIO keyboard connected<span style="color:#8A8A96;font-weight:500">· PC sound ${this.muted ? 'off' : 'on'}</span>`;
          return;
        }
        // short diagnostic so set-up problems are visible (hidden after 10 s)
        const msg = { waiting: 'Looking for keyboard…', ready: 'No keyboard found — check the USB cable', none: 'This browser cannot read keyboards', denied: 'Keyboard access was blocked' }[this.state];
        const keep = this.state === 'none' || this.state === 'denied';
        this.badge.style.display = (this._hint || keep) && msg ? 'flex' : 'none';
        this.badge.innerHTML = `${dot('#C9C9D2')}<span style="color:#8A8A96">${msg || ''}</span>`;
      }
    };
    CasioMIDI.init();


    const KEYS = {
      'C':  { animal: 'LION' },     'C#': { animal: 'CAT' },     'D':  { animal: 'RABBIT' },  'D#': { animal: 'SQUIRREL' },
      'E':  { animal: 'ELEPHANT' }, 'F':  { animal: 'FOX' },     'F#': { animal: 'PANDA' },   'G':  { animal: 'GIRAFFE' },
      'G#': { animal: 'KOALA' },    'A':  { animal: 'ALLIGATOR' }, 'A#': { animal: 'FLAMINGO' }, 'B': { animal: 'BIRD' }
    };

    /* ---------- Canvas setup (crisp on retina) ---------- */
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;
    function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
    addEventListener('resize', resize); resize();

    /* ---------- Intro parade ---------- */
    const parade = document.getElementById('parade');
    Object.values(KEYS).forEach((k, i) => { const im = new Image(); im.src = ANIMAL_IMG[k.animal].src; im.style.animationDelay = `${i * 0.12}s`; parade.appendChild(im); });

    /* ---------- Visual objects ---------- */
    const items = [];
    const spring = t => 1 - Math.exp(-t * 7) * Math.cos(t * 13);

    class AnimalPop {
      constructor(x, y, name, size) { this.x = x; this.y = y; this.img = ANIMAL_IMG[name]; this.size = size; this.t = 0; this.life = 1; this.vx = (Math.random() - .5) * .8; this.vy = -(Math.random() * .6 + .35); this.rot = (Math.random() - .5) * .4; this.wob = Math.random() * 6; }
      update(dt) { this.t += dt; this.x += this.vx; this.y += this.vy; if (this.t > 2.2) this.life -= dt * .9; }
      draw() {
        const s = this.size * Math.max(0, spring(this.t));
        ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, this.life));
        ctx.translate(this.x, this.y); ctx.rotate(this.rot + Math.sin(this.t * 3 + this.wob) * .08);
        ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.beginPath(); ctx.ellipse(0, s * .52, s * .32, s * .07, 0, 0, Math.PI * 2); ctx.fill();
        ctx.drawImage(this.img, -s / 2, -s / 2, s, s);
        ctx.restore();
      }
    }
    class Confetti {
      constructor(x, y, color, power = 1) { const a = Math.random() * Math.PI * 2, sp = (Math.random() * 5 + 2) * power; this.x = x; this.y = y; this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp - 2; this.c = color; this.life = 1; this.r = Math.random() * 5 + 3; this.rot = Math.random() * 6; this.vr = (Math.random() - .5) * .3; this.kind = ['dot', 'rect', 'star', 'note'][Math.random() * 4 | 0]; }
      update(dt) { this.vy += .12; this.vx *= .985; this.x += this.vx; this.y += this.vy; this.rot += this.vr; this.life -= dt * .55; }
      draw() {
        ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.translate(this.x, this.y); ctx.rotate(this.rot); ctx.fillStyle = this.c;
        const r = this.r;
        if (this.kind === 'dot') { ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); }
        else if (this.kind === 'rect') { roundRectPath(ctx, -r, -r * .5, r * 2, r, 2); ctx.fill(); }
        else if (this.kind === 'star') { ctx.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r * 1.2, a = i * Math.PI / 5; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.fill(); }
        else { ctx.font = `700 ${r * 4}px Fredoka, sans-serif`; ctx.textAlign = 'center'; ctx.fillText('♪', 0, r); }
        ctx.restore();
      }
    }
    class Ring {
      constructor(x, y, color) { this.x = x; this.y = y; this.c = color; this.t = 0; this.life = 1; }
      update(dt) { this.t += dt; this.life -= dt * 1.1; }
      draw() { ctx.save(); ctx.globalAlpha = Math.max(0, this.life) * .5; ctx.strokeStyle = this.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(this.x, this.y, 30 + this.t * 220, 0, 7); ctx.stroke(); ctx.restore(); }
    }

    /* ---------- State ---------- */
    let activeMidi = -1, lastPc = -1, holdTimer = 0, sustain = 0, bgColor = '#FFFFFF', bgAlpha = 0;
    let keyRects = [];
    const stab = createStabilizer(5, 3);
    const nowEl = document.getElementById('now');

    function trigger(midi, fromUser, fromMidi) {
      midi = foldMidi(midi);
      const pc = midi % 12, name = NOTE_NAMES[pc], color = PITCH_COLORS[pc], animal = KEYS[name].animal;
      activeMidi = midi; holdTimer = 3; bgColor = color;
      if (pc !== lastPc || fromUser) {
        lastPc = pc;
        const root = midiToFreq(60 + pc);
        if (!(fromMidi && CasioMIDI.silent())) playTone(Mic.audioCtx(), [root, root * Math.pow(2, 4 / 12), root * Math.pow(2, 7 / 12)], { dur: 1.3, vol: .08 });
        const x = W * (.25 + Math.random() * .5), y = H * (.25 + Math.random() * .3);
        items.push(new AnimalPop(x, y, animal, Math.min(W, H) * .2));
        items.push(new Ring(x, y, color));
        for (let i = 0; i < 26; i++) items.push(new Confetti(x, y, PITCH_COLORS[(pc + (i % 3) * 4) % 12], 1.1));
        document.getElementById('now-img').src = ANIMAL_IMG[animal].src;
        document.getElementById('now-chord').textContent = `${name} Major`;
        document.getElementById('now-chord').style.color = color;
        document.getElementById('now-name').textContent = animal;
        document.getElementById('now-pic').style.background = color + '22';
      }
      nowEl.classList.add('show');
    }

    /* ---------- Loop ---------- */
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      const { volume, pitch } = Mic.read(0.07);
      document.getElementById('meter').style.width = `${Math.round(volume * 100)}%`;
      document.getElementById('hz').textContent = pitch > 0 ? `${Math.round(pitch)} Hz` : '-- Hz';
      const st = stab.push(pitch);
      if (st) {
        trigger(st.midi, false);
        sustain += dt;
        if (sustain > .45 && items.filter(i => i instanceof AnimalPop).length < 14) {
          sustain = 0;
          const pc = st.midi % 12;
          items.push(new AnimalPop(W * (.12 + Math.random() * .76), H * (.2 + Math.random() * .4), KEYS[NOTE_NAMES[pc]].animal, Math.min(W, H) * (.08 + volume * .12)));
        }
        if (Math.random() < volume * 1.5) items.push(new Confetti(W * (.2 + Math.random() * .6), H * .45, PITCH_COLORS[pc_(st.midi)], .6 + volume));
      } else { sustain = 0; }
      holdTimer -= dt;
      if (holdTimer <= 0) { nowEl.classList.remove('show'); activeMidi = -1; lastPc = -1; }

      // background
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      bgAlpha += ((holdTimer > 0 ? .16 : 0) - bgAlpha) * .05;
      if (bgAlpha > .005) {
        const g = ctx.createRadialGradient(W / 2, H * .42, 0, W / 2, H * .42, Math.max(W, H) * .6);
        const { r, g: gg, b } = hexToRgb(bgColor);
        g.addColorStop(0, `rgba(${r},${gg},${b},${bgAlpha})`); g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
      // subtle dot grid
      ctx.fillStyle = '#EEEEF3';
      for (let x = 24; x < W; x += 32) for (let y = 80; y < H - 140; y += 32) { ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 7); ctx.fill(); }

      for (let i = items.length - 1; i >= 0; i--) { const it = items[i]; it.update(dt); it.draw(); if (it.life <= 0 || it.y > H + 60) items.splice(i, 1); }

      const kbH = 112, pad = Math.max(16, W * .04);
      keyRects = drawLightKeyboard(ctx, pad, H - kbH - 18, W - pad * 2, kbH, activeMidi, activeMidi >= 0 ? PITCH_COLORS[activeMidi % 12] : '#000');
      requestAnimationFrame(frame);
    }
    const pc_ = m => ((m % 12) + 12) % 12;
    requestAnimationFrame(frame);

    cv.addEventListener('pointerdown', e => { const m = hitKey(keyRects, e.clientX, e.clientY); if (m) { Mic.audioCtx().resume(); trigger(m, true); } });

    /* ---------- Start ---------- */
    const intro = document.getElementById('intro'), err = document.getElementById('error');
    document.getElementById('start').addEventListener('click', async () => {
      try { await Mic.init(); intro.style.display = 'none'; document.getElementById('mic').style.display = 'flex'; }
      catch (e) { err.textContent = e.message && e.message.includes('Chrome') ? e.message : 'Microphone access is needed — or try “Play with keys only”.'; err.style.display = 'block'; }
    });
    document.getElementById('nomic').addEventListener('click', () => { Mic.audioCtx().resume(); intro.style.display = 'none'; });

    // CASIO keyboard: every key press calls its animal (no mic needed)
    CasioMIDI.onNote(m => { intro.style.display = 'none'; trigger(m, true, true); });
  </script>
</body>
</html>
